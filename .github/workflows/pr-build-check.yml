name: PR Build Check

on:
  pull_request:
    branches: [main, dev]
    paths:
      - 'src/**'
      - 'examples/**'
      - 'variants/**'
      - 'platformio.ini'
      - '.github/workflows/pr-build-check.yml'
  push:
    branches: [main, dev]
    paths:
      - 'src/**'
      - 'examples/**'
      - 'variants/**'
      - 'platformio.ini'
      - '.github/workflows/pr-build-check.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        environment:
          # companion builds of this fork: Heltec T114, V3, V4
          - Heltec_t114_companion_radio_ble
          - Heltec_t114_companion_radio_usb
          - Heltec_v3_companion_radio_ble
          - Heltec_v3_companion_radio_usb
          - Heltec_v3_companion_radio_wifi
          - heltec_v4_companion_radio_ble
          - heltec_v4_companion_radio_usb
          - heltec_v4_companion_radio_wifi

    steps:
      - name: Clone Repo
        uses: actions/checkout@v6

      - name: Setup Build Environment
        uses: ./.github/actions/setup-build-environment

      - name: Build ${{ matrix.environment }}
        run: pio run -e ${{ matrix.environment }}
